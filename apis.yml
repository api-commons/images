aid: base-images
name: Images
type: Base
description: |-
  A base Images API for the API Commons — a starting point you copy into your own
  service rather than a hosted API. Upload is a two-step flow (create the record, PUT the bytes to a short-lived URL) and renditions are requested rather than enumerated.

  Errors are RFC 9457 problem details, identical across every API Commons base, and
  checked in CI by the API Commons Problem Details Spectral ruleset.
